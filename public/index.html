<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transmissões do G.A.S</title>

    <style>
        * { box-sizing: border-box; }

        :root {
            color-scheme: dark;
            --fundo: #0e100e;
            --painel: #181c18;
            --borda: #323b32;
            --dourado: #d4af37;
            --texto: #b6c1b6;
        }

        body {
            margin: 0;
            background: var(--fundo);
            color: #fff;
            font-family: "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }

        button {
            padding: 9px 13px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        [hidden] { display: none !important; }

        .verde { background: #238b4e; color: #fff; }
        .vermelho { background: #c4383c; color: #fff; }
        .dourado { background: var(--dourado); color: #151815; }
        .cinza { background: #363f36; color: #fff; }

        header {
            padding: 14px 18px;
            background: var(--painel);
            border-bottom: 2px solid #8b2626;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            color: var(--dourado);
            font-size: 17px;
        }

        #identidade {
            color: var(--texto);
            font-size: 13px;
        }

        #barra {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            padding: 12px 18px;
        }

        #status {
            padding: 0 18px 12px;
            color: var(--texto);
            font-size: 13px;
            min-height: 28px;
        }

        #layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 15px;
            padding: 0 18px 18px;
            align-items: start;
        }

        #layout.sem-lateral { grid-template-columns: 1fr; }

        #area-telas { min-width: 0; }

        #aviso {
            text-align: center;
            padding: 70px 15px;
            color: var(--texto);
            border: 1px dashed var(--borda);
            border-radius: 10px;
        }

        #grade {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(min(100%, 360px), 1fr));
            gap: 14px;
        }

        #destaque:not(:empty) { margin-bottom: 15px; }

        .tela {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--borda);
            border-radius: 9px;
            background: var(--painel);
        }

        #destaque .tela { border-color: var(--dourado); }

        .tela-topo {
            padding: 8px 11px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .nome {
            color: var(--dourado);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .etiqueta {
            color: var(--texto);
            font-size: 11px;
            flex-shrink: 0;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #000;
            max-height: 70vh;
        }

        .tela-controles {
            padding: 8px 10px;
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
            color: var(--texto);
            font-size: 12px;
        }

        .tela-controles button {
            padding: 6px 9px;
            font-size: 12px;
        }

        input[type="range"] {
            width: 75px;
            accent-color: var(--dourado);
        }

        #lateral {
            border: 1px solid var(--borda);
            background: var(--painel);
            border-radius: 10px;
            overflow: hidden;
            position: sticky;
            top: 12px;
        }

        #abas {
            display: flex;
            gap: 6px;
            padding: 10px;
            border-bottom: 1px solid var(--borda);
        }

        #abas button { flex: 1; }

        #mensagens {
            height: 390px;
            overflow-y: auto;
            padding: 12px;
        }

        .mensagem {
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        .mensagem-topo {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 3px;
        }

        .mensagem-nome {
            font-size: 12px;
            color: var(--dourado);
            font-weight: 600;
        }

        .horario {
            color: #859185;
            font-size: 10px;
        }

        .mensagem-texto {
            font-size: 13px;
            white-space: pre-wrap;
        }

        .aviso-chat {
            margin: 10px 0;
            font-size: 11px;
            color: #8fa08f;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #form-chat {
            padding: 10px;
            display: flex;
            gap: 7px;
            border-top: 1px solid var(--borda);
        }

        #texto-chat {
            min-width: 0;
            flex: 1;
        }

        input[type="text"] {
            background: #0e100e;
            color: #fff;
            border: 1px solid #435043;
            border-radius: 6px;
            padding: 10px;
        }

        #lista-pessoas {
            padding: 10px;
            max-height: 450px;
            overflow-y: auto;
        }

        .pessoa {
            padding: 11px 6px;
            border-bottom: 1px solid var(--borda);
            overflow-wrap: anywhere;
        }

        .pessoa small {
            display: block;
            margin-top: 4px;
            color: var(--texto);
            font-size: 11px;
        }

        #entrada {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .94);
        }

        #form-entrada {
            width: 100%;
            max-width: 380px;
            padding: 26px;
            background: var(--painel);
            border: 1px solid var(--dourado);
            border-radius: 12px;
        }

        #form-entrada h2 {
            margin-top: 0;
            color: var(--dourado);
        }

        #form-entrada p {
            color: var(--texto);
            font-size: 14px;
        }

        #nickname {
            width: 100%;
            margin: 9px 0 15px;
        }

        #form-entrada button { width: 100%; }

        #erro-entrada {
            margin-top: 12px;
            color: #ffb1b1;
            font-size: 13px;
        }

        @media (max-width: 850px) {
            #layout { grid-template-columns: 1fr; }
            #lateral { position: static; }
            #mensagens { height: 300px; }
            header, #barra { padding-left: 12px; padding-right: 12px; }
            #layout { padding-left: 12px; padding-right: 12px; }
        }
    </style>
</head>

<body>
    <div id="entrada">
        <form id="form-entrada">
            <h2>Transmissões do G.A.S</h2>
            <p>Escolha seu nickname para entrar.</p>

            <label for="nickname">Nickname</label>
            <input
                type="text"
                id="nickname"
                maxlength="24"
                autocomplete="nickname"
                placeholder="Seu nome"
                required
            >

            <button type="submit" class="dourado">
                Entrar
            </button>

            <div id="erro-entrada" role="alert"></div>
        </form>
    </div>

    <header>
        <h1>Transmissões do G.A.S</h1>
        <span id="identidade"></span>
    </header>

    <div id="barra">
        <button id="compartilhar" class="verde" disabled>
            Compartilhar Tela
        </button>

        <button id="parar" class="vermelho" hidden>
            Parar minha tela
        </button>

        <button id="copiar" class="dourado">
            Copiar Link
        </button>

        <button id="abrir-chat" class="cinza">Chat</button>
        <button id="abrir-pessoas" class="cinza">Participantes — 0</button>
        <button id="voltar-grade" class="cinza" hidden>Voltar à grade</button>
    </div>

    <div id="status" role="status">Escolha um nickname para entrar.</div>

    <div id="layout">
        <main id="area-telas">
            <div id="aviso">Nenhuma transmissão ativa.</div>
            <div id="destaque"></div>
            <div id="grade"></div>
        </main>

        <aside id="lateral">
            <div id="abas">
                <button id="aba-chat" class="dourado">Chat</button>
                <button id="aba-pessoas" class="cinza">Participantes</button>
                <button id="fechar-lateral" class="cinza" aria-label="Fechar painel">
                    Fechar
                </button>
            </div>

            <section id="painel-chat">
                <div id="mensagens" aria-live="polite"></div>

                <form id="form-chat">
                    <input
                        type="text"
                        id="texto-chat"
                        maxlength="500"
                        placeholder="Sua mensagem..."
                        aria-label="Mensagem"
                        autocomplete="off"
                        disabled
                        required
                    >
                    <button id="enviar-chat" class="verde" disabled>
                        Enviar
                    </button>
                </form>
            </section>

            <section id="painel-pessoas" hidden>
                <div id="lista-pessoas"></div>
            </section>
        </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const $ = (id) => document.getElementById(id);

        const configIce = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        let socket = null;
        let nickname = "";
        let registrado = false;
        let capturando = false;
        let streamLocal = null;

        let destaqueId = null;
        let abaAtual = "chat";
        let naoLidas = 0;

        const nomes = new Map();
        const cards = new Map();
        const envios = new Map();
        const recebimentos = new Map();
        const filas = new Map();

        function status(texto) {
            $("status").textContent = texto;
        }

        function atualizarBotoes() {
            $("compartilhar").disabled = !registrado || capturando;
            $("compartilhar").hidden = !!streamLocal;
            $("parar").hidden = !streamLocal;

            $("texto-chat").disabled = !registrado;
            $("enviar-chat").disabled = !registrado;
        }

        function atualizarAviso() {
            $("aviso").hidden = cards.size > 0;
        }

        function atualizarContadorChat() {
            $("abrir-chat").textContent = naoLidas
                ? `Chat (${naoLidas})`
                : "Chat";
        }

        function abrirPainel(aba) {
            abaAtual = aba;
            $("lateral").hidden = false;
            $("layout").classList.remove("sem-lateral");

            $("painel-chat").hidden = aba !== "chat";
            $("painel-pessoas").hidden = aba !== "pessoas";

            $("aba-chat").className = aba === "chat" ? "dourado" : "cinza";
            $("aba-pessoas").className = aba === "pessoas" ? "dourado" : "cinza";

            if (aba === "chat") {
                naoLidas = 0;
                atualizarContadorChat();

                $("mensagens").scrollTop =
                    $("mensagens").scrollHeight;
            }
        }

        function adicionarMensagem(dados, sistema = false, contar = true) {
            const item = document.createElement("div");

            if (sistema) {
                item.className = "aviso-chat";
                item.textContent = dados.texto;
            } else {
                item.className = "mensagem";

                const topo = document.createElement("div");
                topo.className = "mensagem-topo";

                const nome = document.createElement("span");
                nome.className = "mensagem-nome";
                nome.textContent = dados.nickname;

                const horario = document.createElement("span");
                horario.className = "horario";
                horario.textContent = new Date(dados.horario)
                    .toLocaleTimeString("pt-BR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                const texto = document.createElement("div");
                texto.className = "mensagem-texto";
                texto.textContent = dados.texto;

                topo.append(nome, horario);
                item.append(topo, texto);
            }

            $("mensagens").append(item);

            while ($("mensagens").children.length > 200) {
                $("mensagens").firstElementChild.remove();
            }

            $("mensagens").scrollTop = $("mensagens").scrollHeight;

            if (
                contar &&
                !sistema &&
                ($("lateral").hidden || abaAtual !== "chat") &&
                dados.de !== socket?.id
            ) {
                naoLidas++;
                atualizarContadorChat();
            }
        }

        function atualizarParticipantes(lista) {
            $("abrir-pessoas").textContent =
                `Participantes — ${lista.length}`;

            $("lista-pessoas").replaceChildren();

            for (const pessoa of lista) {
                nomes.set(pessoa.id, pessoa.nickname);

                const linha = document.createElement("div");
                linha.className = "pessoa";

                const nome = document.createElement("div");
                nome.textContent =
                    pessoa.nickname +
                    (pessoa.id === socket.id ? " (você)" : "");

                const estado = document.createElement("small");
                estado.textContent = pessoa.compartilhando
                    ? "Compartilhando tela"
                    : "Na sala";

                linha.append(nome, estado);
                $("lista-pessoas").append(linha);
            }
        }

        function voltarGrade() {
            if (destaqueId && cards.has(destaqueId)) {
                const card = cards.get(destaqueId);
                $("grade").append(card.elemento);
                card.botaoDestaque.textContent = "Destacar";
                tocar(card);
            }

            destaqueId = null;
            $("voltar-grade").hidden = true;
        }

        function destacar(id) {
            if (destaqueId === id) {
                voltarGrade();
                return;
            }

            voltarGrade();

            const card = cards.get(id);
            if (!card) return;

            destaqueId = id;
            card.botaoDestaque.textContent = "Voltar à grade";

            $("destaque").append(card.elemento);
            $("voltar-grade").hidden = false;

            tocar(card);
        }

        function criarCard(id, nome, local = false) {
            if (cards.has(id)) {
                const card = cards.get(id);
                card.nome.textContent = nome;
                return card;
            }

            const elemento = document.createElement("section");
            elemento.className = "tela";

            const topo = document.createElement("div");
            topo.className = "tela-topo";

            const rotulo = document.createElement("span");
            rotulo.className = "nome";
            rotulo.textContent = nome;

            const etiqueta = document.createElement("span");
            etiqueta.className = "etiqueta";
            etiqueta.textContent = local ? "Sua tela" : "Ao vivo";

            topo.append(rotulo, etiqueta);

            const video = document.createElement("video");
            video.autoplay = true;
            video.playsInline = true;
            video.muted = local;
            video.volume = local ? 0 : 0.8;

            const controles = document.createElement("div");
            controles.className = "tela-controles";

            const reproduzir = document.createElement("button");
            reproduzir.className = "verde";
            reproduzir.textContent = "Reproduzir";
            reproduzir.hidden = true;

            const botaoDestaque = document.createElement("button");
            botaoDestaque.className = "dourado";
            botaoDestaque.textContent = "Destacar";
            botaoDestaque.onclick = () => destacar(id);

            const fullscreen = document.createElement("button");
            fullscreen.className =
