<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>APP G.A.S oficial</title>
    <link rel="icon" type="image/png" href="brasao.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #141714; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        #tela-container { flex: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0e100e; padding: 15px; position: relative; }
        video { width: 100%; max-height: 82vh; border-radius: 6px; background: #000; display: none; border: 1px solid #d4af37; cursor: pointer; }
        #aviso-tela { color: #8c968c; font-size: 1rem; text-align: center; }
        
        #controles { position: absolute; bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; background: #181c18; padding: 8px 14px; border-radius: 8px; border: 1px solid #2f362f; z-index: 10; }
        button { padding: 8px 14px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.15s; }
        button:hover { opacity: 0.9; }
        .btn-verde { background: #23a559; color: #fff; }
        .btn-vermelho { background: #da373c; color: #fff; }
        .btn-dourado { background: #d4af37; color: #141714; }
        .btn-cinza { background: #3f443f; color: #fff; }
        .btn-ptt-ativo { background: #e67e22; color: #fff; }
        #status-link { font-size: 12px; color: #23a559; font-weight: bold; }

        .controle-vol-tela { display: none; align-items: center; gap: 6px; background: #252b25; padding: 6px 10px; border-radius: 5px; font-size: 12px; color: #d4af37; }
        .controle-vol-tela input[type="range"] { width: 75px; cursor: pointer; accent-color: #d4af37; padding: 0; }

        #chat-container { flex: 1; display: flex; flex-direction: column; background: #1b1f1b; border-left: 1px solid #2f362f; min-width: 310px; }
        #cabecalho-chat { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #222722; border-bottom: 2px solid #8b2626; }
        #cabecalho-chat img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }
        #cabecalho-chat h3 { margin: 0; font-size: 15px; color: #d4af37; letter-spacing: 0.5px; }
        #cabecalho-chat span { font-size: 11px; color: #a3ada3; }

        #painel-operadores { padding: 8px 14px; background: #171b17; border-bottom: 1px solid #2f362f; max-height: 150px; overflow-y: auto; }
        #painel-operadores small { color: #8c968c; font-weight: bold; font-size: 10px; text-transform: uppercase; display: block; margin-bottom: 6px; }
        #lista-usuarios { display: flex; flex-wrap: wrap; gap: 6px; }
        .operador-badge { display: flex; align-items: center; gap: 6px; background: #252b25; padding: 4px 10px; border-radius: 15px; font-size: 12px; border: 1px solid transparent; transition: 0.15s; }
        .operador-badge .ponto { width: 7px; height: 7px; border-radius: 50%; background: #6c756c; }
        .operador-badge.falando { border-color: #23a559; background: #1e3324; box-shadow: 0 0 6px rgba(35, 165, 89, 0.4); }
        .operador-badge.falando .ponto { background: #23a559; }
        .vol-op { width: 55px; height: 4px; cursor: pointer; accent-color: #23a559; padding: 0; margin-left: 4px; }

        #mensagens { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { background: #262b26; padding: 7px 10px; border-radius: 5px; word-wrap: break-word; font-size: 13px; }
        .msg strong { color: #d4af37; }
        #form-chat { display: flex; padding: 8px; background: #222722; }
        input[type="text"] { flex: 1; padding: 9px; border: 1px solid #384038; border-radius: 4px; background: #141714; color: #fff; outline: none; font-size: 13px; }
        input[type="text"]:focus { border-color: #d4af37; }
    </style>
</head>
<body>
    <div id="tela-container">
        <div id="aviso-tela">APP G.A.S oficial — Nenhuma transmissão de tela ativa no momento.</div>
        <video id="video-tela" autoplay playsinline></video>
        <div id="controles">
            <button id="btn-mic" class="btn-cinza" onclick="alternarMicrofone()">🎤 Ligar Mic</button>
            <button id="btn-ptt" class="btn-cinza" onclick="alternarModoPTT()">📻 PTT: OFF</button>
            <button id="btn-tecla" class="btn-cinza" style="display:none;" onclick="configurarTeclaPTT()">Tecla: [V]</button>
            <button id="btn-compartilhar" class="btn-verde" onclick="iniciarCompartilhamento()">🖥️ Tela</button>
            <button id="btn-parar" class="btn-vermelho" style="display:none;" onclick="pararCompartilhamento()">⏹️ Parar</button>
            
            <div id="box-vol-tela" class="controle-vol-tela" title="Volume do som da tela/jogo">
                <span>🔊</span>
                <input type="range" id="slider-vol-tela" min="0" max="1" step="0.05" value="0.8" oninput="ajustarVolumeTela(this.value)">
            </div>

            <button id="btn-fullscreen" class="btn-cinza" style="display:none;" onclick="alternarTelaCheia()">⛶ Tela Cheia</button>
            <button id="btn-link" class="btn-dourado" onclick="copiarLinkSala()">🔗 Link</button>
            <span id="status-link"></span>
        </div>
    </div>

    <div id="chat-container">
        <div id="cabecalho-chat">
            <img src="brasao.png" alt="Brasão G.A.S">
            <div>
                <h3>APP G.A.S OFICIAL</h3>
                <span>Grupo de Assalto • Rádio Tático</span>
            </div>
        </div>
        <div id="painel-operadores">
            <small>Operadores na Frequência</small>
            <div id="lista-usuarios"></div>
        </div>
        <div id="mensagens"></div>
        <form id="form-chat" onsubmit="enviarMensagem(event)">
            <input type="text" id="input-msg" placeholder="Mensagem no rádio..." autocomplete="off">
        </form>
    </div>

    <div id="audios-remotos"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const nome = prompt("APP G.A.S oficial — Digite seu nome de operador:") || "Operador";
        socket.emit('entrar-sala', nome);

        const configIce = { iceServers: [{ urls: 'stun:://google.com' }] };
        const volumesOperadores = {};

        socket.on('lista-operadores', (operadores) => {
            const lista = document.getElementById('lista-usuarios');
            lista.innerHTML = '';
            Object.entries(operadores).forEach(([id, nomeOp]) => {
                const badge = document.createElement('div');
                badge.className = 'operador-badge';
                badge.id = `op-${id}`;

                if (id === socket.id) {
                    badge.innerHTML = `<span class="ponto"></span><span>${nomeOp} (Você)</span>`;
                } else {
                    const volAtual = volumesOperadores[id] !== undefined ? volumesOperadores[id] : 1;
                    badge.innerHTML = `
                        <span class="ponto"></span>
                        <span>${nomeOp}</span>
                        <input type="range" class="vol-op" min="0" max="1" step="0.05" value="${volAtual}" 
                               title="Volume de ${nomeOp}" oninput="ajustarVolumeOperador('${id}', this.value)">
                    `;
                }
                lista.appendChild(badge);
            });
        });

        function ajustarVolumeOperador(idAmigo, valor) {
            volumesOperadores[idAmigo] = parseFloat(valor);
            const audioEl = document.getElementById(`audio-${idAmigo}`);
            if (audioEl) {
                audioEl.volume = volumesOperadores[idAmigo];
            }
        }

        let audioCtx = null;
        function monitorarVolume(stream, idOperador) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const source = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                const intervalo = setInterval(() => {
                    if (!stream.active) {
                        clearInterval(intervalo);
                        return;
                    }
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) soma += dataArray[i];
                    const badge = document.getElementById(`op-${idOperador}`);
                    if (badge) {
                        badge.classList.toggle('falando', (soma / dataArray.length) > 14);
                    }
                }, 120);
            } catch (e) {}
        }

        let streamMic = null;
        let micAtivo = false;
        let modoPTT = false;
        let teclaPTT = 'KeyV';
        let nomeTeclaPTT = 'V';
        let aguardandoNovaTecla = false;
        const conexoesVoz = {};

        async function inicializarMicrofone() {
            if (!streamMic) {
                streamMic = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: false
                });
                monitorarVolume(streamMic, socket.id);
                Object.values(conexoesVoz).forEach(pc => {
                    streamMic.getTracks().forEach(track => pc.addTrack(track, streamMic));
                });
            }
        }

        async function alternarMicrofone() {
            try {
                await inicializarMicrofone();
                if (modoPTT) {
