<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APP G.A.S Oficial</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background: #0e100e;
            color: #fff;
        }

        button,
        input {
            font: inherit;
        }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .verde {
            background: #23a559;
            color: #fff;
        }

        .vermelho {
            background: #da373c;
            color: #fff;
        }

        .dourado {
            background: #d4af37;
            color: #141714;
        }

        .cinza {
            background: #3f443f;
            color: #fff;
        }

        #topo {
            padding: 14px 20px;
            background: #181c18;
            border-bottom: 2px solid #8b2626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            color: #d4af37;
        }

        #identidade {
            color: #bbc5bb;
            font-size: 13px;
        }

        #barra {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #status {
            font-size: 13px;
            color: #aebaae;
        }

        #aviso {
            padding: 40px 20px;
            text-align: center;
            color: #98a398;
        }

        #grade {
            padding: 0 20px 25px;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(min(100%, 420px), 1fr));
            gap: 16px;
        }

        .tela {
            min-width: 0;
            overflow: hidden;
            background: #181c18;
            border: 1px solid #414b35;
            border-radius: 9px;
        }

        .tela-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
        }

        .nome {
            font-size: 12px;
            font-weight: 600;
            color: #d4af37;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .etiqueta {
            font-size: 11px;
            color: #9ba99b;
            flex-shrink: 0;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #000;
        }

        .tela-controles {
            padding: 9px 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
            color: #bbc5bb;
        }

        .tela-controles button {
            padding: 7px 10px;
            font-size: 12px;
        }

        input[type="range"] {
            width: 90px;
            accent-color: #d4af37;
        }

        #entrada {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #form-entrada {
            width: 100%;
            max-width: 380px;
            padding: 28px;
            background: #181c18;
            border: 1px solid #d4af37;
            border-radius: 12px;
        }

        #form-entrada h2 {
            margin: 0 0 12px;
            color: #d4af37;
        }

        #form-entrada p {
            color: #b2bdb2;
            font-size: 14px;
        }

        #nickname {
            width: 100%;
            margin: 10px 0 16px;
            padding: 12px;
            border: 1px solid #414b41;
            border-radius: 6px;
            background: #0e100e;
            color: #fff;
        }

        #form-entrada button {
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="entrada">
        <form id="form-entrada">
            <h2>APP G.A.S</h2>
            <p>Digite o nome que aparecerá na sua transmissão.</p>

            <label for="nickname">Nickname</label>
            <input
                id="nickname"
                maxlength="24"
                placeholder="Seu nickname"
                autocomplete="nickname"
                required
            >

            <button type="submit" class="dourado">
                Entrar
            </button>
        </form>
    </div>

    <header id="topo">
        <h1>APP G.A.S OFICIAL — TRANSMISSÕES</h1>
        <span id="identidade"></span>
    </header>

    <div id="barra">
        <button
            id="btn-compartilhar"
            class="verde"
            disabled
        >
            Compartilhar Tela
        </button>

        <button
            id="btn-parar"
            class="vermelho"
            hidden
        >
            Parar minha transmissão
        </button>

        <button id="btn-link" class="dourado">
            Copiar Link
        </button>

        <span id="status" role="status">Escolha seu nickname.</span>
    </div>

    <div id="aviso">
        Nenhuma transmissão ativa.
    </div>

    <main id="grade"></main>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const $ = (id) => document.getElementById(id);

        const configIce = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        let socket = null;
        let nickname = "";
        let registrado = false;
        let capturando = false;
        let streamLocal = null;

        const nomes = new Map();
        const cards = new Map();

        // Envio e recebimento ficam separados.
        const envios = new Map();
        const recebimentos = new Map();

        // Mantém a ordem das mensagens de cada conexão.
        const filas = new Map();

        function status(texto) {
            $("status").textContent = texto;
        }

        function atualizarBotoes() {
            $("btn-compartilhar").disabled =
                !registrado || capturando;

            $("btn-compartilhar").hidden = !!streamLocal;
            $("btn-parar").hidden = !streamLocal;
        }

        function atualizarAviso() {
            $("aviso").hidden = cards.size > 0;
        }

        function criarCard(id, nome, local = false) {
            if (cards.has(id)) {
                const existente = cards.get(id);
                existente.nome.textContent = nome;
                return existente;
            }

            const elemento = document.createElement("section");
            elemento.className = "tela";

            const topo = document.createElement("div");
            topo.className = "tela-topo";

            const rotulo = document.createElement("span");
            rotulo.className = "nome";
            rotulo.textContent = nome;

            const etiqueta = document.createElement("span");
            etiqueta.className = "etiqueta";
            etiqueta.textContent = local ? "Sua tela" : "Ao vivo";

            topo.append(rotulo, etiqueta);

            const video = document.createElement("video");
            video.autoplay = true;
            video.playsInline = true;
            video.muted = local;
            video.volume = local ? 0 : 0.8;

            const controles = document.createElement("div");
            controles.className = "tela-controles";

            const reproduzir = document.createElement("button");
            reproduzir.className = "verde";
            reproduzir.textContent = "Reproduzir";
            reproduzir.hidden = true;

            reproduzir.onclick = async () => {
                try {
                    await video.play();
                    reproduzir.hidden = true;
                } catch (erro) {
                    status("Não foi possível reproduzir essa tela.");
                    console.error(erro);
                }
            };

            const fullscreen = document.createElement("button");
            fullscreen.className = "cinza";
            fullscreen.textContent = "Tela cheia";

            fullscreen.onclick = async () => {
                try {
                    if (video.requestFullscreen) {
                        await video.requestFullscreen();
                    }
                } catch (erro) {
                    console.error(erro);
                }
            };

            video.ondblclick = fullscreen.onclick;
            controles.append(reproduzir, fullscreen);

            if (!local) {
                const label = document.createElement("label");
                label.textContent = "Volume ";

                const volume = document.createElement("input");
                volume.type = "range";
                volume.min = "0";
                volume.max = "1";
                volume.step = "0.05";
                volume.value = "0.8";

                volume.oninput = () => {
                    video.volume = Number(volume.value);
                    video.muted = Number(volume.value) === 0;
                };

                label.append(volume);
                controles.append(label);
            }

            elemento.append(topo, video, controles);
            $("grade").append(elemento);

            const card = {
                elemento,
                nome: rotulo,
                video,
                reproduzir
            };

            cards.set(id, card);
            atualizarAviso();

            return card;
        }

        async function tocar(card) {
            try {
                await card.video.play();
                card.reproduzir.hidden = true;
            } catch {
                card.reproduzir.hidden = false;
            }
        }

        function removerCard(id) {
            const card = cards.get(id);
            if (!card) return;

            card.video.pause();
            card.video.srcObject = null;
            card.elemento.remove();
            cards.delete(id);

            atualizarAviso();
        }

        function fecharEntrada(mapa, id) {
            const entrada = mapa.get(id);
            if (!entrada) return;

            entrada.pc.ontrack = null;
            entrada.pc.onicecandidate = null;
            entrada.pc.close();

            mapa.delete(id);
        }

        function limparRemotos() {
            for (const id of [...envios.keys()]) {
                fecharEntrada(envios, id);
            }

            for (const id of [...recebimentos.keys()]) {
                fecharEntrada(recebimentos, id);
                removerCard(id);
            }

            filas.clear();
        }

        function emitirSinal(destino, transmissor, sinal) {
            if (!registrado || !socket?.connected) return;

            socket.emit("sinal-tela", {
                para: destino,
                transmissor,
                sinal
            });
        }

        function criarConexao(mapa, id, destino, transmissor) {
            const pc = new RTCPeerConnection(configIce);

            const entrada = {
                pc,
                candidatos: [],
                stream: new MediaStream()
            };

            mapa.set(id, entrada);

            pc.onicecandidate = (evento) => {
                if (evento.candidate) {
                    emitirSinal(destino, transmissor, {
                        candidate: evento.candidate
                    });
                }
            };

            return entrada;
        }

        async function iniciarTela() {
            if (!registrado || streamLocal || capturando) return;

            if (!navigator.mediaDevices?.getDisplayMedia) {
                status(
                    "Captura indisponível. Use HTTPS ou localhost " +
                    "em um navegador compatível."
                );
                return;
            }

            capturando = true;
            atualizarBotoes();

            try {
                const stream =
                    await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: true
                    });

                if (!registrado || !socket.connected) {
                    stream.getTracks().forEach((track) => track.stop());
                    status("Reconecte-se antes de compartilhar.");
                    return;
                }

                streamLocal = stream;

                const card = criarCard(
                    "local",
                    nickname,
                    true
                );

                card.video.srcObject = streamLocal;
                tocar(card);

                const faixa = streamLocal.getVideoTracks()[0];

                if (faixa) {
                    faixa.onended = pararTela;
                }

                socket.emit("iniciou-tela");
                status("Sua tela está sendo compartilhada.");
            } catch (erro) {
                console.error(erro);

                status(
                    erro.name === "NotAllowedError"
                        ? "Compartilhamento cancelado ou não autorizado."
                        : "Erro ao capturar: " + erro.message
                );
            } finally {
                capturando = false;
                atualizarBotoes();
            }
        }

        function pararTela() {
            if (!streamLocal) return;

            streamLocal.getTracks().forEach((track) => {
                track.onended = null;
                track.stop();
            });

            streamLocal = null;

            for (const id of [...envios.keys()]) {
                fecharEntrada(envios, id);
            }

            removerCard("local");

            if (registrado && socket?.connected) {
                socket.emit("parou-tela");
            }

            atualizarBotoes();
            status("Sua transmissão foi encerrada.");
        }

        async function enviarTela(dados) {
            if (!streamLocal || !dados?.para) return;

            const espectador = dados.para;

            // Evita recriar uma conexão já existente.
            if (envios.has(espectador)) return;

            const entrada = criarConexao(
                envios,
                espectador,
                espectador,
                socket.id
            );

            try {
                streamLocal.getTracks().forEach((track) => {
                    entrada.pc.addTrack(track, streamLocal);
                });

                const oferta = await entrada.pc.createOffer();
                await entrada.pc.setLocalDescription(oferta);

                emitirSinal(espectador, socket.id, {
                    sdp: entrada.pc.localDescription
                });
            } catch (erro) {
                console.error("Erro ao enviar tela:", erro);

                if (envios.get(espectador) === entrada) {
                    fecharEntrada(envios, espectador);
                }
            }
        }

        async function processarSinal(dados) {
            if (!registrado || !dados?.sinal) return;

            const souTransmissor =
                dados.transmissor === socket.id;

            const mapa = souTransmissor
                ? envios
                : recebimentos;

            const id = souTransmissor
                ? dados.de
                : dados.transmissor;

            // O recebimento deve vir do dono daquela tela.
            if (!souTransmissor && dados.de !== id) return;

            let entrada = mapa.get(id);

            if (!entrada) {
                if (souTransmissor) return;

                entrada = criarConexao(
                    recebimentos,
                    id,
                    id,
                    id
                );

                const nome =
                    dados.nickname ||
                    nomes.get(id) ||
                    "Participante";

                nomes.set(id, nome);

                entrada.pc.ontrack = (evento) => {
                    const card = criarCard(
                        id,
                        nomes.get(id) || "Participante"
                    );

                    if (evento.streams[0]) {
                        card.video.srcObject = evento.streams[0];
                    } else {
                        entrada.stream.addTrack(evento.track);
                        card.video.srcObject = entrada.stream;
                    }

                    tocar(card);
                };
            }

            const pc = entrada.pc;
            const sinal = dados.sinal;

            if (sinal.sdp) {
                await pc.setRemoteDescription(sinal.sdp);

                while (entrada.candidatos.length) {
                    await pc.addIceCandidate(
                        entrada.candidatos.shift()
                    );
                }

                if (sinal.sdp.type === "offer") {
                    const resposta = await pc.createAnswer();
                    await pc.setLocalDescription(resposta);

                    emitirSinal(dados.de, dados.transmissor, {
                        sdp: pc.localDescription
                    });
                }
            } else if (sinal.candidate) {
                if (pc.remoteDescription) {
                    await pc.addIceCandidate(sinal.candidate);
                } else {
                    entrada.candidatos.push(sinal.candidate);
                }
            }
        }

        function registrar() {
            if (!nickname || !socket?.connected) return;

            socket.emit("registrar", { nickname }, (resposta) => {
                if (!resposta?.ok) {
                    status(resposta?.erro || "Erro ao entrar.");
                    return;
                }

                registrado = true;
                nickname = resposta.nickname;

                $("entrada").style.display = "none";
                $("identidade").textContent = "Você: " + nickname;

                atualizarBotoes();
                status("Conectado.");

                if (streamLocal) {
                    socket.emit("iniciou-tela");
                }

                socket.emit("quero-assistir");
            });
        }

        function conectar() {
            if (typeof io !== "function") {
                status(
                    "Socket.IO não carregado. " +
                    "Abra esta página pelo servidor da aplicação."
                );
                return;
            }

            socket = io();

            socket.on("connect", registrar);

            socket.on("disconnect", () => {
                registrado = false;
                limparRemotos();
                atualizarBotoes();
                status("Desconectado. Tentando reconectar...");
            });

            socket.on("connect_error", (erro) => {
                status("Não foi possível conectar ao servidor.");
                console.error(erro);
            });

            socket.on("lista-transmissores", (lista) => {
                for (const pessoa of lista) {
                    nomes.set(pessoa.id, pessoa.nickname);

                    const card = cards.get(pessoa.id);
                    if (card) {
                        card.nome.textContent = pessoa.nickname;
                    }
                }
            });

            socket.on("nova-transmissao", (dados) => {
                nomes.set(dados.id, dados.nickname);

                if (registrado && dados.id !== socket.id) {
                    socket.emit("quero-assistir", {
                        de: dados.id
                    });
                }
            });

            socket.on("pedir-tela", enviarTela);

            socket.on("sinal-tela", (dados) => {
                if (!dados?.transmissor || !dados?.de) return;

                const chave =
                    dados.transmissor + ":" + dados.de;

                const anterior =
                    filas.get(chave) || Promise.resolve();

                const atual = anterior
                    .then(() => processarSinal(dados))
                    .catch((erro) => {
                        console.error(
                            "Erro na sinalização:",
                            erro
                        );
                    });

                filas.set(chave, atual);

                atual.finally(() => {
                    if (filas.get(chave) === atual) {
                        filas.delete(chave);
                    }
                });
            });

            socket.on("parou-tela", (dados) => {
                if (!dados?.de) return;

                fecharEntrada(recebimentos, dados.de);
                removerCard(dados.de);
            });

            socket.on("participante-saiu", (dados) => {
                if (!dados?.de) return;

                fecharEntrada(envios, dados.de);
                fecharEntrada(recebimentos, dados.de);
                removerCard(dados.de);
                nomes.delete(dados.de);
            });
        }

        $("form-entrada").addEventListener("submit", (evento) => {
            evento.preventDefault();

            const valor = $("nickname").value.trim();

            if (!valor) {
                $("nickname").focus();
                return;
            }

            nickname = valor.slice(0, 24);

            status("Conectando...");

            if (!socket) {
                conectar();
            } else {
                registrar();
            }
        });

        $("btn-compartilhar").onclick = iniciarTela;
        $("btn-parar").onclick = pararTela;

        $("btn-link").onclick = async () => {
            try {
                await navigator.clipboard.writeText(location.href);
                status("Link copiado!");
            } catch {
                window.prompt("Copie o link:", location.href);
            }
        };
    </script>
</body>
</html>
