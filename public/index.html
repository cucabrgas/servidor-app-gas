<body>
    <div id="topo">
        <h1>APP G.A.S OFICIAL — TRANSMISSÃO</h1>

        <div>
            <button
                type="button"
                class="btn-dourado"
                onclick="copiarLink()"
            >
                Copiar Link
            </button>

            <span id="status-link" role="status"></span>
        </div>
    </div>

    <div id="tela-container">
        <div id="aviso-tela" role="status">
            Nenhuma transmissão ativa.
            Clique em "Compartilhar Tela" abaixo para iniciar.
        </div>

        <video id="video-tela" autoplay playsinline></video>

        <div id="controles">
            <button
                type="button"
                id="btn-compartilhar"
                class="btn-verde"
                onclick="iniciarTela()"
            >
                Compartilhar Tela
            </button>

            <button
                type="button"
                id="btn-parar"
                class="btn-vermelho"
                style="display: none;"
                onclick="pararTela()"
            >
                Parar Transmissão
            </button>

            <button
                type="button"
                id="btn-reproduzir"
                class="btn-verde"
                style="display: none;"
                onclick="reproduzirVideo()"
            >
                Reproduzir transmissão
            </button>

            <div
                id="box-vol-tela"
                class="controle-vol-tela"
                title="Volume do áudio compartilhado"
            >
                <label for="slider-vol-tela">Volume</label>

                <input
                    type="range"
                    id="slider-vol-tela"
                    min="0"
                    max="1"
                    step="0.05"
                    value="0.8"
                    oninput="mudarVolume(this.value)"
                >
            </div>

            <button
                type="button"
                id="btn-fullscreen"
                class="btn-cinza"
                style="display: none;"
                onclick="telaCheia()"
            >
                Tela Cheia
            </button>
        </div>
    </div>

    <!-- Cliente fornecido pelo seu servidor Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        var socket = null;
        var streamTela = null;
        var conexoesTela = {};
        var candidatosPendentes = {};
        var filasSinalizacao = {};

        var configIce = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        var video = document.getElementById("video-tela");
        var aviso = document.getElementById("aviso-tela");
        var btnCompartilhar = document.getElementById("btn-compartilhar");
        var btnParar = document.getElementById("btn-parar");
        var btnFullscreen = document.getElementById("btn-fullscreen");
        var btnReproduzir = document.getElementById("btn-reproduzir");
        var boxVolume = document.getElementById("box-vol-tela");
        var sliderVolume = document.getElementById("slider-vol-tela");

        function mostrarVideo(transmitindo) {
            video.style.display = "block";
            aviso.style.display = "none";
            btnCompartilhar.style.display = "none";
            btnParar.style.display = transmitindo ? "inline-block" : "none";
            btnFullscreen.style.display = "inline-block";
            boxVolume.style.display = transmitindo ? "none" : "flex";
            btnReproduzir.style.display = "none";
        }

        function limparVideo() {
            video.pause();
            video.srcObject = null;
            video.style.display = "none";
            video.muted = true;

            aviso.textContent =
                'Nenhuma transmissão ativa. Clique em "Compartilhar Tela" abaixo para iniciar.';

            aviso.style.display = "block";
            btnCompartilhar.style.display = "inline-block";
            btnParar.style.display = "none";
            btnFullscreen.style.display = "none";
            btnReproduzir.style.display = "none";
            boxVolume.style.display = "none";
        }

        async function reproduzirVideo() {
            try {
                await video.play();
                btnReproduzir.style.display = "none";
            } catch (err) {
                console.warn("Não foi possível reproduzir o vídeo:", err);
                btnReproduzir.style.display = "inline-block";
            }
        }

        function fecharConexoes() {
            Object.keys(conexoesTela).forEach(function(id) {
                var pc = conexoesTela[id];

                pc.ontrack = null;
                pc.onicecandidate = null;
                pc.close();
            });

            conexoesTela = {};
            candidatosPendentes = {};
        }

        async function iniciarTela() {
            if (streamTela) return;

            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getDisplayMedia) {
                alert(
                    "Captura de tela indisponível. " +
                    "Acesse por HTTPS ou localhost em um navegador compatível."
                );
                return;
            }

            btnCompartilhar.disabled = true;

            try {
                var stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                fecharConexoes();
                streamTela = stream;

                video.srcObject = streamTela;
                video.muted = true;

                mostrarVideo(true);
                await reproduzirVideo();

                var faixa = streamTela.getVideoTracks()[0];

                if (faixa) {
                    faixa.onended = function() {
                        pararTela();
                    };
                }

                if (socket && socket.connected) {
                    socket.emit("iniciou-tela");
                } else {
                    console.warn(
                        "Captura local iniciada, mas o servidor de sinalização não está conectado."
                    );
                }
            } catch (err) {
                console.error("Erro ao capturar tela:", err);

                if (err.name !== "NotAllowedError" &&
                    err.name !== "AbortError") {
                    alert("Erro ao capturar tela: " + err.message);
                }
            } finally {
                btnCompartilhar.disabled = false;
            }
        }

        async function pararTela() {
            var estavaTransmitindo = Boolean(streamTela);

            if (streamTela) {
                streamTela.getTracks().forEach(function(track) {
                    track.onended = null;
                    track.stop();
                });

                streamTela = null;
            }

            fecharConexoes();

            if (document.fullscreenElement) {
                try {
                    await document.exitFullscreen();
                } catch (err) {
                    console.warn("Erro ao sair da tela cheia:", err);
                }
            }

            limparVideo();

            if (estavaTransmitindo && socket && socket.connected) {
                socket.emit("parou-tela");
            }
        }

        async function copiarLink() {
            var status = document.getElementById("status-link");

            try {
                await navigator.clipboard.writeText(window.location.href);

                status.textContent = " Copiado!";

                setTimeout(function() {
                    status.textContent = "";
                }, 2500);
            } catch (err) {
                console.warn("Erro ao copiar link:", err);
                window.prompt("Copie o link abaixo:", window.location.href);
            }
        }

        function mudarVolume(valor) {
            var volume = Number(valor);

            video.volume = volume;
            video.muted = volume === 0;
        }

        async function telaCheia() {
            try {
                if (!document.fullscreenElement) {
                    if (video.requestFullscreen) {
                        await video.requestFullscreen();
                    }
                } else if (document.exitFullscreen) {
                    await document.exitFullscreen();
                }
            } catch (err) {
                console.error("Erro ao alternar tela cheia:", err);
            }
        }

        function criarConexao(idRemetente) {
            var pc = new RTCPeerConnection(configIce);

            conexoesTela[idRemetente] = pc;
            candidatosPendentes[idRemetente] = [];

            pc.onicecandidate = function(evento) {
                if (evento.candidate && socket && socket.connected) {
                    socket.emit("sinal-tela", {
                        para: idRemetente,
                        sinal: {
                            candidate: evento.candidate
                        }
                    });
                }
            };

            pc.ontrack = function(evento) {
                if (streamTela) return;

                var streamRecebido = evento.streams[0];

                if (streamRecebido) {
                    video.srcObject = streamRecebido;
                } else {
                    if (!video.srcObject) {
                        video.srcObject = new MediaStream();
                    }

                    video.srcObject.addTrack(evento.track);
                }

                video.volume = Number(sliderVolume.value);
                video.muted = video.volume === 0;

                mostrarVideo(false);
                reproduzirVideo();
            };

            return pc;
        }

        async function aplicarCandidatosPendentes(id, pc) {
            var candidatos = candidatosPendentes[id] || [];

            while (candidatos.length > 0) {
                await pc.addIceCandidate(candidatos.shift());
            }
        }

        async function processarSinal(dados) {
            if (!dados || !dados.de || !dados.sinal) return;

            var idRemetente = dados.de;
            var sinal = dados.sinal;
            var pc = conexoesTela[idRemetente];

            if (!pc) {
                pc = criarConexao(idRemetente);
            }

            if (sinal.sdp) {
                await pc.setRemoteDescription(sinal.sdp);
                await aplicarCandidatosPendentes(idRemetente, pc);

                if (sinal.sdp.type === "offer") {
                    var resposta = await pc.createAnswer();

                    await pc.setLocalDescription(resposta);

                    socket.emit("sinal-tela", {
                        para: idRemetente,
                        sinal: {
                            sdp: pc.localDescription
                        }
                    });
                }
            } else if (sinal.candidate) {
                if (pc.remoteDescription) {
                    await pc.addIceCandidate(sinal.candidate);
                } else {
                    candidatosPendentes[idRemetente].push(
                        sinal.candidate
                    );
                }
            }
        }

        video.addEventListener("dblclick", telaCheia);

        try {
            if (typeof io !== "function") {
                throw new Error(
                    "Biblioteca Socket.IO não carregada. " +
                    "Verifique /socket.io/socket.io.js no seu servidor."
                );
            }

            socket = io();

            socket.on("connect", function() {
                console.log("Conectado ao servidor:", socket.id);

                if (streamTela) {
                    socket.emit("iniciou-tela");
                } else {
                    socket.emit("quero-assistir");
                }
            });

            socket.on("connect_error", function(err) {
                console.error("Erro de conexão com o servidor:", err.message);
            });

            socket.on("disconnect", function(motivo) {
                console.warn("Desconectado do servidor:", motivo);
            });

            socket.on("solicitar-conexao", function() {
                if (!streamTela) {
                    socket.emit("quero-assistir");
                }
            });

            socket.on("pedir-tela", async function(dados) {
                if (!streamTela || !dados || !dados.para) return;

                var idEspectador = dados.para;

                try {
                    if (conexoesTela[idEspectador]) {
                        conexoesTela[idEspectador].close();
                    }

                    var pc = criarConexao(idEspectador);

                    streamTela.getTracks().forEach(function(track) {
                        pc.addTrack(track, streamTela);
                    });

                    var oferta = await pc.createOffer();

                    await pc.setLocalDescription(oferta);

                    socket.emit("sinal-tela", {
                        para: idEspectador,
                        sinal: {
                            sdp: pc.localDescription
                        }
                    });
                } catch (err) {
                    console.error(
                        "Erro ao preparar transmissão para o espectador:",
                        err
                    );
                }
            });

            socket.on("sinal-tela", function(dados) {
                if (!dados || !dados.de) return;

                var id = dados.de;
                var filaAnterior = filasSinalizacao[id] || Promise.resolve();

                var novaFila = filaAnterior
                    .then(function() {
                        return processarSinal(dados);
                    })
                    .catch(function(err) {
                        console.error("Erro na sinalização WebRTC:", err);
                    });

                filasSinalizacao[id] = novaFila;

                novaFila.finally(function() {
                    if (filasSinalizacao[id] === novaFila) {
                        delete filasSinalizacao[id];
                    }
                });
            });

            socket.on("parou-tela", function() {
                if (streamTela) return;

                fecharConexoes();
                limparVideo();
            });

        } catch (err) {
            console.error("Erro ao inicializar o Socket.IO:", err);
        }
    </script>
</body>
</html>
