<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APP G.A.S oficial</title>

    <style>
        * { box-sizing: border-box; }

        :root {
            color-scheme: dark;
            --fundo: #0e100e;
            --painel: #181c18;
            --borda: #323b32;
            --dourado: #d4af37;
            --texto: #b6c1b6;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--fundo);
            color: #fff;
            font-family: "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }

        button {
            padding: 9px 13px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        button:hover { filter: brightness(1.1); }
        button:disabled { opacity: .45; cursor: not-allowed; }
        [hidden] { display: none !important; }

        .verde { background: #238b4e; color: #fff; }
        .vermelho { background: #c4383c; color: #fff; }
        .dourado { background: var(--dourado); color: #151815; }
        .cinza { background: #363f36; color: #fff; }

        header {
            padding: 14px 18px;
            background: var(--painel);
            border-bottom: 2px solid #8b2626;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            color: var(--dourado);
            font-size: 17px;
        }

        #identidade {
            color: var(--texto);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #barra {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            padding: 12px 18px;
        }

        #status {
            padding: 0 18px 12px;
            color: var(--texto);
            font-size: 13px;
            min-height: 28px;
            overflow-wrap: anywhere;
        }

        #layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 15px;
            padding: 0 18px 18px;
            align-items: start;
        }

        #layout.sem-lateral { grid-template-columns: 1fr; }
        #area-telas { min-width: 0; }

        #aviso {
            text-align: center;
            padding: 70px 15px;
            color: var(--texto);
            border: 1px dashed var(--borda);
            border-radius: 10px;
        }

        #grade {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(min(100%, 360px), 1fr));
            gap: 14px;
        }

        #destaque:not(:empty) { margin-bottom: 15px; }

        .tela {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--borda);
            border-radius: 9px;
            background: var(--painel);
        }

        #destaque .tela { border-color: var(--dourado); }

        .tela-topo {
            padding: 8px 11px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .nome {
            color: var(--dourado);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .etiqueta {
            color: var(--texto);
            font-size: 11px;
            flex-shrink: 0;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #000;
            max-height: 70vh;
        }

        .estatisticas-video {
            padding: 5px 11px;
            border-top: 1px solid var(--borda);
            background: #111611;
            color: #b9d6a3;
            font-family: Consolas, monospace;
            font-size: 11px;
        }

        .tela-controles {
            padding: 8px 10px;
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
            color: var(--texto);
            font-size: 12px;
        }

        .tela-controles button {
            padding: 6px 9px;
            font-size: 12px;
        }

        input[type="range"] {
            width: 75px;
            accent-color: var(--dourado);
        }

        .tela:fullscreen {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .tela:fullscreen video {
            flex: 1;
            min-height: 0;
            max-height: none;
            aspect-ratio: auto;
        }

        .tela:fullscreen .tela-topo,
        .tela:fullscreen .estatisticas-video,
        .tela:fullscreen .tela-controles {
            flex-shrink: 0;
            background: #181c18;
        }

        #lateral {
            border: 1px solid var(--borda);
            background: var(--painel);
            border-radius: 10px;
            overflow: hidden;
            position: sticky;
            top: 12px;
        }

        #abas {
            display: flex;
            gap: 6px;
            padding: 10px;
            border-bottom: 1px solid var(--borda);
        }

        #abas button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        #mensagens {
            height: 390px;
            overflow-y: auto;
            padding: 12px;
        }

        .mensagem {
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        .mensagem-topo {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 3px;
        }

        .mensagem-nome {
            font-size: 12px;
            color: var(--dourado);
            font-weight: 600;
        }

        .horario { color: #859185; font-size: 10px; }

        .mensagem-texto {
            font-size: 13px;
            white-space: pre-wrap;
        }

        .aviso-chat {
            margin: 10px 0;
            font-size: 11px;
            color: #8fa08f;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #form-chat {
            padding: 10px;
            display: flex;
            gap: 7px;
            border-top: 1px solid var(--borda);
        }

        #texto-chat { min-width: 0; flex: 1; }

        input[type="text"] {
            background: #0e100e;
            color: #fff;
            border: 1px solid #435043;
            border-radius: 6px;
            padding: 10px;
        }

        #lista-pessoas {
            padding: 10px;
            max-height: 450px;
            overflow-y: auto;
        }

        .pessoa {
            padding: 11px 6px;
            border-bottom: 1px solid var(--borda);
            overflow-wrap: anywhere;
        }

        .pessoa small {
            display: block;
            margin-top: 4px;
            color: var(--texto);
            font-size: 11px;
        }

        #entrada {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .94);
        }

        #form-entrada {
            width: 100%;
            max-width: 380px;
            padding: 26px;
            background: var(--painel);
            border: 1px solid var(--dourado);
            border-radius: 12px;
        }

        #form-entrada h2 {
            margin-top: 0;
            color: var(--dourado);
        }

        #form-entrada p { color: var(--texto); font-size: 14px; }
        #nickname { width: 100%; margin: 9px 0 15px; }
        #form-entrada button { width: 100%; }

        #erro-entrada {
            margin-top: 12px;
            color: #ffb1b1;
            font-size: 13px;
        }

        @media (max-width: 850px) {
            #layout { grid-template-columns: 1fr; }
            #lateral { position: static; }
            #mensagens { height: 300px; }

            header, #barra {
                padding-left: 12px;
                padding-right: 12px;
            }

            #layout {
                padding-left: 12px;
                padding-right: 12px;
            }

            h1 { font-size: 15px; }
        }
    </style>
</head>

<body>
    <div id="entrada">
        <form id="form-entrada">
            <h2>APP G.A.S oficial</h2>
            <p>Escolha seu nickname para entrar.</p>

            <label for="nickname">Nickname</label>
            <input
                type="text"
                id="nickname"
                maxlength="24"
                autocomplete="nickname"
                placeholder="Seu nome"
                required
            >

            <button type="submit" class="dourado">Entrar</button>
            <div id="erro-entrada" role="alert"></div>
        </form>
    </div>

    <header>
        <h1>APP G.A.S OFICIAL — TRANSMISSÃO</h1>
        <span id="identidade"></span>
    </header>

    <div id="barra">
        <button id="compartilhar" class="verde" disabled>
            Compartilhar Tela
        </button>

        <button id="parar" class="vermelho" hidden>
            Parar minha tela
        </button>

        <button id="copiar" class="dourado">Copiar Link</button>
        <button id="abrir-chat" class="cinza">Chat</button>

        <button id="abrir-pessoas" class="cinza">
            Participantes — 0
        </button>

        <button id="voltar-grade" class="cinza" hidden>
            Voltar à grade
        </button>
    </div>

    <div id="status" role="status">
        Escolha um nickname para entrar.
    </div>

    <div id="layout">
        <main id="area-telas">
            <div id="aviso">Nenhuma transmissão ativa.</div>
            <div id="destaque"></div>
            <div id="grade"></div>
        </main>

        <aside id="lateral">
            <div id="abas">
                <button id="aba-chat" class="dourado">Chat</button>
                <button id="aba-pessoas" class="cinza">Participantes</button>
                <button
                    id="fechar-lateral"
                    class="cinza"
                    aria-label="Fechar painel"
                >
                    Fechar
                </button>
            </div>

            <section id="painel-chat">
                <div id="mensagens" aria-live="polite"></div>

                <form id="form-chat">
                    <input
                        type="text"
                        id="texto-chat"
                        maxlength="500"
                        placeholder="Sua mensagem..."
                        aria-label="Mensagem"
                        autocomplete="off"
                        disabled
                        required
                    >
                    <button id="enviar-chat" class="verde" disabled>
                        Enviar
                    </button>
                </form>
            </section>

            <section id="painel-pessoas" hidden>
                <div id="lista-pessoas"></div>
            </section>
        </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const $ = (id) => document.getElementById(id);

        const configIce = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        let socket = null;
        let nickname = "";
        let registrado = false;
        let capturando = false;
        let streamLocal = null;
        let destaqueId = null;
        let abaAtual = "chat";
        let naoLidas = 0;
        let atualizandoEstatisticas = false;
        let geracaoConexao = 0;

        const nomes = new Map();
        const cards = new Map();
        const envios = new Map();
        const recebimentos = new Map();
        const filas = new Map();

        function status(texto) {
            $("status").textContent = texto;
        }

        function atualizarBotoes() {
            $("compartilhar").disabled = !registrado || capturando;
            $("compartilhar").hidden = Boolean(streamLocal);
            $("parar").hidden = !streamLocal;
            $("texto-chat").disabled = !registrado;
            $("enviar-chat").disabled = !registrado;
        }

        function atualizarAviso() {
            $("aviso").hidden = cards.size > 0;
        }

        function atualizarAudioDasTelas() {
            const fullscreen = document.fullscreenElement;
            let selecionado = null;

            for (const card of cards.values()) {
                if (
                    fullscreen === card.elemento ||
                    fullscreen === card.video
                ) {
                    selecionado = card.video;
                    break;
                }
            }

            for (const [id, card] of cards) {
                if (id === "local") {
                    card.video.muted = true;
                } else {
                    card.video.muted =
                        card.video.volume === 0 ||
                        Boolean(
                            selecionado &&
                            selecionado !== card.video
                        );
                }

                const estaFullscreen =
                    fullscreen === card.elemento ||
                    fullscreen === card.video;

                card.botaoFullscreen.textContent = estaFullscreen
                    ? "Sair da tela cheia"
                    : "Tela cheia";
            }
        }

        document.addEventListener(
            "fullscreenchange",
            atualizarAudioDasTelas
        );

        function atualizarContadorChat() {
            $("abrir-chat").textContent = naoLidas
                ? `Chat (${naoLidas})`
                : "Chat";
        }

        function abrirPainel(aba) {
            abaAtual = aba;
            $("lateral").hidden = false;
            $("layout").classList.remove("sem-lateral");

            $("painel-chat").hidden = aba !== "chat";
            $("painel-pessoas").hidden = aba !== "pessoas";
            $("aba-chat").className =
                aba === "chat" ? "dourado" : "cinza";
            $("aba-pessoas").className =
                aba === "pessoas" ? "dourado" : "cinza";

            if (aba === "chat") {
                naoLidas = 0;
                atualizarContadorChat();
                $("mensagens").scrollTop = $("mensagens").scrollHeight;
            }
        }

        function adicionarMensagem(dados, sistema = false, contar = true) {
            const item = document.createElement("div");

            if (sistema) {
                item.className = "aviso-chat";
                item.textContent = dados.texto;
            } else {
                item.className = "mensagem";

                const topo = document.createElement("div");
                topo.className = "mensagem-topo";

                const nome = document.createElement("span");
                nome.className = "mensagem-nome";
                nome.textContent = dados.nickname;

                const horario = document.createElement("span");
                horario.className = "horario";
                horario.textContent = new Date(dados.horario)
                    .toLocaleTimeString("pt-BR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                const texto = document.createElement("div");
                texto.className = "mensagem-texto";
                texto.textContent = dados.texto;

                topo.append(nome, horario);
                item.append(topo, texto);
            }

            $("mensagens").append(item);

            while ($("mensagens").children.length > 200) {
                $("mensagens").firstElementChild.remove();
            }

            $("mensagens").scrollTop = $("mensagens").scrollHeight;

            if (
                contar &&
                !sistema &&
                ($("lateral").hidden || abaAtual !== "chat") &&
                dados.de !== socket?.id
            ) {
                naoLidas++;
                atualizarContadorChat();
            }
        }

        function atualizarParticipantes(lista) {
            $("abrir-pessoas").textContent =
                `Participantes — ${lista.length}`;

            $("lista-pessoas").replaceChildren();

            for (const pessoa of lista) {
                nomes.set(pessoa.id, pessoa.nickname);

                const linha = document.createElement("div");
                linha.className = "pessoa";

                const nome = document.createElement("div");
                nome.textContent =
                    pessoa.nickname +
                    (pessoa.id === socket.id ? " (você)" : "");

                const estado = document.createElement("small");
                estado.textContent = pessoa.compartilhando
                    ? "Compartilhando tela"
                    : "Na sala";

                linha.append(nome, estado);
                $("lista-pessoas").append(linha);
            }
        }

        function voltarGrade() {
            if (destaqueId && cards.has(destaqueId)) {
                const card = cards.get(destaqueId);
                $("grade").append(card.elemento);
                card.botaoDestaque.textContent = "Destacar";
                tocar(card);
            }

            destaqueId = null;
            $("voltar-grade").hidden = true;
        }

        function destacar(id) {
            if (destaqueId === id) {
                voltarGrade();
                return;
            }

            voltarGrade();

            const card = cards.get(id);
            if (!card) return;

            destaqueId = id;
            card.botaoDestaque.textContent = "Voltar à grade";
            $("destaque").append(card.elemento);
            $("voltar-grade").hidden = false;
            tocar(card);
        }

        function criarCard(id, nome, local = false) {
            if (cards.has(id)) {
                const card = cards.get(id);
                card.nome.textContent = nome;
                return card;
            }

            const elemento = document.createElement("section");
            elemento.className = "tela";

            const topo = document.createElement("div");
            topo.className = "tela-topo";

            const rotulo = document.createElement("span");
            rotulo.className = "nome";
            rotulo.textContent = nome;

            const etiqueta = document.createElement("span");
            etiqueta.className = "etiqueta";
            etiqueta.textContent = local ? "Sua tela" : "Ao vivo";
            topo.append(rotulo, etiqueta);

            const video = document.createElement("video");
            video.autoplay = true;
            video.playsInline = true;
            video.muted = local;
            video.volume = local ? 0 : 0.8;

            const estatisticas = document.createElement("div");
            estatisticas.className = "estatisticas-video";
            estatisticas.textContent = "Aguardando dados do vídeo...";

            const controles = document.createElement("div");
            controles.className = "tela-controles";

            const reproduzir = document.createElement("button");
            reproduzir.className = "verde";
            reproduzir.textContent = "Reproduzir";
            reproduzir.hidden = true;

            const botaoDestaque = document.createElement("button");
            botaoDestaque.className = "dourado";
            botaoDestaque.textContent = "Destacar";
            botaoDestaque.onclick = () => destacar(id);

            const botaoFullscreen = document.createElement("button");
            botaoFullscreen.className = "cinza";
            botaoFullscreen.textContent = "Tela cheia";

            botaoFullscreen.onclick = async () => {
                try {
                    if (document.fullscreenElement === elemento) {
                        await document.exitFullscreen();
                    } else if (elemento.requestFullscreen) {
                        await elemento.requestFullscreen();
                    } else {
                        status("Tela cheia indisponível neste navegador.");
                    }
                } catch (erro) {
                    console.error(erro);
                    status("Não foi possível alternar a tela cheia.");
                }
            };

            video.ondblclick = botaoFullscreen.onclick;

            controles.append(
                reproduzir,
                botaoDestaque,
                botaoFullscreen
            );

            if (!local) {
                const label = document.createElement("label");
                label.textContent = "Volume ";

                const volume = document.createElement("input");
                volume.type = "range";
                volume.min = "0";
                volume.max = "1";
                volume.step = "0.05";
                volume.value = "0.8";
                volume.setAttribute("aria-label", `Volume de ${nome}`);

                volume.oninput = () => {
                    video.volume = Number(volume.value);
                    atualizarAudioDasTelas();
                };

                label.append(volume);
                controles.append(label);
            }

            elemento.append(topo, video, estatisticas, controles);
            $("grade").append(elemento);

            const card = {
                elemento,
                nome: rotulo,
                video,
                reproduzir,
                botaoDestaque,
                botaoFullscreen,
                estatisticas,
                amostraFps: null
            };

            reproduzir.onclick = () => tocar(card);

            cards.set(id, card);
            atualizarAviso();
            atualizarAudioDasTelas();

            return card;
        }

        async function tocar(card) {
            try {
                atualizarAudioDasTelas();
                await card.video.play();
                card.reproduzir.hidden = true;
            } catch {
                card.reproduzir.hidden = false;
            }
        }

        function removerCard(id) {
            const card = cards.get(id);
            if (!card) return;

            if (document.fullscreenElement === card.elemento) {
                document.exitFullscreen().catch(console.debug);
            }

            if (destaqueId === id) {
                destaqueId = null;
                $("voltar-grade").hidden = true;
            }

            card.video.pause();
            card.video.srcObject = null;
            card.elemento.remove();

            cards.delete(id);
            atualizarAviso();
            atualizarAudioDasTelas();
        }

        function fecharEntrada(mapa, id) {
            const entrada = mapa.get(id);
            if (!entrada) return;

            entrada.pc.ontrack = null;
            entrada.pc.onicecandidate = null;
            entrada.pc.close();
            mapa.delete(id);
        }

        function limparRemotos() {
            for (const id of [...envios.keys()]) {
                fecharEntrada(envios, id);
            }

            for (const id of [...recebimentos.keys()]) {
                fecharEntrada(recebimentos, id);
                removerCard(id);
            }

            filas.clear();
        }

        function emitirSinal(destino, transmissor, sinal) {
            if (!registrado || !socket?.connected) return;

            socket.emit("sinal-tela", {
                para: destino,
                transmissor,
                sinal
            });
        }

        function criarConexao(mapa, id, destino, transmissor) {
            const entrada = {
                pc: new RTCPeerConnection(configIce),
                candidatos: [],
                stream: new MediaStream()
            };

            mapa.set(id, entrada);

            entrada.pc.onicecandidate = (evento) => {
                if (
                    evento.candidate &&
                    mapa.get(id) === entrada
                ) {
                    emitirSinal(destino, transmissor, {
                        candidate: evento.candidate
                    });
                }
            };

            return entrada;
        }

        async function iniciarTela() {
            if (!registrado || streamLocal || capturando) return;

            if (!navigator.mediaDevices?.getDisplayMedia) {
                status(
                    "Captura indisponível. Use HTTPS " +
                    "e um navegador compatível."
                );
                return;
            }

            capturando = true;
            atualizarBotoes();

            try {
                const stream =
                    await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: true
                    });

                if (!registrado || !socket.connected) {
                    stream.getTracks().forEach((track) => track.stop());
                    status("Reconecte-se antes de compartilhar.");
                    return;
                }

                streamLocal = stream;

                const card = criarCard("local", nickname, true);
                card.video.srcObject = streamLocal;
                tocar(card);

                const faixa = streamLocal.getVideoTracks()[0];
                if (faixa) faixa.onended = pararTela;

                socket.emit("iniciou-tela");

                status(
                    streamLocal.getAudioTracks().length
                        ? "Compartilhando tela com faixa de áudio."
                        : "Compartilhando tela sem faixa de áudio."
                );
            } catch (erro) {
                console.error(erro);

                status(
                    erro.name === "NotAllowedError" ||
                    erro.name === "AbortError"
                        ? "Compartilhamento cancelado ou não autorizado."
                        : "Erro ao capturar: " + erro.message
                );
            } finally {
                capturando = false;
                atualizarBotoes();
            }
        }

        function pararTela() {
            if (!streamLocal) return;

            streamLocal.getTracks().forEach((track) => {
                track.onended = null;
                track.stop();
            });

            streamLocal = null;

            for (const id of [...envios.keys()]) {
                fecharEntrada(envios, id);
            }

            removerCard("local");

            if (registrado && socket?.connected) {
                socket.emit("parou-tela");
            }

            atualizarBotoes();
            status("Sua transmissão foi encerrada.");
        }

        async function enviarTela(dados) {
            if (!streamLocal || !dados?.para) return;

            const espectador = dados.para;
            if (envios.has(espectador)) return;

            const meuId = socket.id;

            const entrada = criarConexao(
                envios,
                espectador,
                espectador,
                meuId
            );

            try {
                streamLocal.getTracks().forEach((track) => {
                    entrada.pc.addTrack(track, streamLocal);
                });

                const oferta = await entrada.pc.createOffer();
                await entrada.pc.setLocalDescription(oferta);

                if (envios.get(espectador) !== entrada) return;

                emitirSinal(espectador, meuId, {
                    sdp: entrada.pc.localDescription
                });
            } catch (erro) {
                console.error("Erro ao enviar tela:", erro);

                if (envios.get(espectador) === entrada) {
                    fecharEntrada(envios, espectador);
                }
            }
        }

        async function processarSinal(dados) {
            if (!registrado || !dados?.sinal) return;

            const souTransmissor = dados.transmissor === socket.id;
            const mapa = souTransmissor ? envios : recebimentos;
            const id = souTransmissor ? dados.de : dados.transmissor;

            if (!souTransmissor && dados.de !== id) return;

            let entrada = mapa.get(id);

            if (!entrada) {
                if (souTransmissor) return;

                entrada = criarConexao(recebimentos, id, id, id);

                nomes.set(
                    id,
                    dados.nickname || nomes.get(id) || "Participante"
                );

                entrada.pc.ontrack = (evento) => {
                    if (recebimentos.get(id) !== entrada) return;

                    const card = criarCard(
                        id,
                        nomes.get(id) || "Participante"
                    );

                    if (evento.streams[0]) {
                        card.video.srcObject = evento.streams[0];
                    } else {
                        entrada.stream.addTrack(evento.track);
                        card.video.srcObject = entrada.stream;
                    }

                    tocar(card);
                };
            }

            const pc = entrada.pc;
            const sinal = dados.sinal;

            if (sinal.sdp) {
                await pc.setRemoteDescription(sinal.sdp);
                if (mapa.get(id) !== entrada) return;

                while (entrada.candidatos.length) {
                    await pc.addIceCandidate(
                        entrada.candidatos.shift()
                    );
                }

                if (sinal.sdp.type === "offer") {
                    const resposta = await pc.createAnswer();
                    await pc.setLocalDescription(resposta);
                    if (mapa.get(id) !== entrada) return;

                    emitirSinal(dados.de, dados.transmissor, {
                        sdp: pc.localDescription
                    });
                }
            } else if (sinal.candidate) {
                if (pc.remoteDescription) {
                    await pc.addIceCandidate(sinal.candidate);
                } else {
                    entrada.candidatos.push(sinal.candidate);
                }
            }
        }

        function formatarEstatisticas(largura, altura, fps, prefixo) {
            const resolucao = largura > 0 && altura > 0
                ? `${largura} × ${altura}`
                : "Resolução indisponível";

            const taxa = Number.isFinite(fps)
                ? `${Math.max(0, fps).toFixed(0)} FPS`
                : "FPS indisponível";

            return `${prefixo}: ${resolucao} · ${taxa}`;
        }

        async function atualizarEstatisticas() {
            if (atualizandoEstatisticas) return;
            atualizandoEstatisticas = true;

            try {
                for (const [id, card] of cards) {
                    if (id === "local") {
                        const faixa = streamLocal?.getVideoTracks()[0];
                        if (!faixa) continue;

                        const config = faixa.getSettings();

                        card.estatisticas.textContent =
                            formatarEstatisticas(
                                config.width || card.video.videoWidth,
                                config.height || card.video.videoHeight,
                                config.frameRate,
                                "Captura (config.)"
                            );

                        continue;
                    }

                    const entrada = recebimentos.get(id);
                    if (!entrada) continue;
                    if (entrada.pc.connectionState === "closed") continue;

                    try {
                        const relatorio = await entrada.pc.getStats();

                        if (
                            cards.get(id) !== card ||
                            recebimentos.get(id) !== entrada
                        ) {
                            continue;
                        }

                        let dados = null;

                        for (const item of relatorio.values()) {
                            if (
                                item.type === "inbound-rtp" &&
                                (
                                    item.kind === "video" ||
                                    item.mediaType === "video"
                                )
                            ) {
                                dados = item;
                                break;
                            }
                        }

                        if (!dados) continue;

                        let fps = dados.framesPerSecond;
                        const anterior = card.amostraFps;

                        if (
                            !Number.isFinite(fps) &&
                            Number.isFinite(dados.framesDecoded) &&
                            anterior &&
                            anterior.id === dados.id
                        ) {
                            const segundos =
                                (dados.timestamp - anterior.timestamp) / 1000;

                            const quadros =
                                dados.framesDecoded - anterior.frames;

                            if (segundos > 0 && quadros >= 0) {
                                fps = quadros / segundos;
                            }
                        }

                        card.amostraFps = {
                            id: dados.id,
                            frames: dados.framesDecoded,
                            timestamp: dados.timestamp
                        };

                        card.estatisticas.textContent =
                            formatarEstatisticas(
                                dados.frameWidth || card.video.videoWidth,
                                dados.frameHeight || card.video.videoHeight,
                                fps,
                                "Recebido"
                            );
                    } catch (erro) {
                        console.debug("Estatísticas indisponíveis:", erro);
                    }
                }
            } finally {
                atualizandoEstatisticas = false;
            }
        }

        function registrar() {
            if (!nickname || !socket?.connected) return;

            socket.emit("registrar", { nickname }, (resposta) => {
                if (!resposta?.ok) {
                    registrado = false;
                    $("entrada").hidden = false;

                    $("erro-entrada").textContent =
                        resposta?.erro || "Erro ao entrar.";

                    atualizarBotoes();
                    return;
                }

                registrado = true;
                nickname = resposta.nickname;

                $("entrada").hidden = true;
                $("erro-entrada").textContent = "";
                $("identidade").textContent = "Você: " + nickname;

                const local = cards.get("local");
                if (local) local.nome.textContent = nickname;

                atualizarBotoes();
                status("Conectado à sala.");

                if (streamLocal) socket.emit("iniciou-tela");
                socket.emit("quero-assistir");
            });
        }

        function conectar() {
            if (typeof io !== "function") {
                $("erro-entrada").textContent =
                    "Socket.IO não carregou. Abra a página pelo servidor.";
                return;
            }

            socket = io();

            socket.on("connect", () => {
                geracaoConexao++;
                registrar();
            });

            socket.on("disconnect", () => {
                registrado = false;
                geracaoConexao++;

                limparRemotos();
                atualizarBotoes();
                $("lista-pessoas").replaceChildren();
                $("abrir-pessoas").textContent = "Participantes — 0";

                status("Desconectado. Tentando reconectar...");
            });

            socket.on("connect_error", (erro) => {
                console.error(erro);
                status("Não foi possível conectar ao servidor.");

                $("erro-entrada").textContent =
                    "Falha na conexão. Tentando novamente...";
            });

            socket.on("lista-participantes", atualizarParticipantes);

            socket.on("lista-transmissores", (lista) => {
                for (const pessoa of lista) {
                    nomes.set(pessoa.id, pessoa.nickname);

                    const card = cards.get(pessoa.id);
                    if (card) card.nome.textContent = pessoa.nickname;
                }
            });

            socket.on("historico-chat", (lista) => {
                $("mensagens").replaceChildren();

                for (const mensagem of lista) {
                    adicionarMensagem(mensagem, false, false);
                }
            });

            socket.on("mensagem-chat", (dados) => {
                adicionarMensagem(dados);
            });

            socket.on("aviso-chat", (dados) => {
                adicionarMensagem(dados, true);
            });

            socket.on("nova-transmissao", (dados) => {
                nomes.set(dados.id, dados.nickname);

                if (registrado && dados.id !== socket.id) {
                    socket.emit("quero-assistir", { de: dados.id });
                }
            });

            socket.on("pedir-tela", enviarTela);

            socket.on("sinal-tela", (dados) => {
                if (!dados?.transmissor || !dados?.de) return;

                const chave = dados.transmissor + ":" + dados.de;
                const geracao = geracaoConexao;
                const anterior = filas.get(chave) || Promise.resolve();

                const atual = anterior
                    .then(() => {
                        if (geracao !== geracaoConexao) return;
                        return processarSinal(dados);
                    })
                    .catch((erro) => {
                        console.error("Erro de sinalização:", erro);
                    });

                filas.set(chave, atual);

                atual.finally(() => {
                    if (filas.get(chave) === atual) {
                        filas.delete(chave);
                    }
                });
            });

            socket.on("parou-tela", (dados) => {
                if (!dados?.de) return;
                fecharEntrada(recebimentos, dados.de);
                removerCard(dados.de);
            });

            socket.on("participante-saiu", (dados) => {
                if (!dados?.de) return;

                fecharEntrada(envios, dados.de);
                fecharEntrada(recebimentos, dados.de);
                removerCard(dados.de);
                nomes.delete(dados.de);
            });
        }

        $("form-entrada").onsubmit = (evento) => {
            evento.preventDefault();

            const valor = $("nickname").value.trim();
            if (!valor) return;

            nickname = valor.slice(0, 24);
            $("erro-entrada").textContent = "Conectando...";

            if (!socket) conectar();
            else if (socket.connected) registrar();
            else socket.connect();
        };

        $("form-chat").onsubmit = (evento) => {
            evento.preventDefault();

            const texto = $("texto-chat").value.trim();

            if (!texto || !registrado || !socket?.connected) return;

            $("texto-chat").value = "";

            socket.emit("mensagem-chat", { texto }, (resposta) => {
                if (!resposta?.ok) {
                    status(resposta?.erro || "Não foi possível enviar.");

                    if (!$("texto-chat").value) {
                        $("texto-chat").value = texto;
                    }
                }
            });
        };

        $("compartilhar").onclick = iniciarTela;
        $("parar").onclick = pararTela;
        $("voltar-grade").onclick = voltarGrade;

        $("abrir-chat").onclick = () => abrirPainel("chat");
        $("aba-chat").onclick = () => abrirPainel("chat");

        $("abrir-pessoas").onclick = () => abrirPainel("pessoas");
        $("aba-pessoas").onclick = () => abrirPainel("pessoas");

        $("fechar-lateral").onclick = () => {
            $("lateral").hidden = true;
            $("layout").classList.add("sem-lateral");
        };

        $("copiar").onclick = async () => {
            try {
                await navigator.clipboard.writeText(location.href);
                status("Link copiado!");
            } catch {
                window.prompt("Copie o link:", location.href);
            }
        };

        setInterval(atualizarEstatisticas, 1000);
    </script>
</body>
